name: Windows layout regression
on:
  push:
    branches: ['fix/windows-page-list-overlap']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check long PDF sidebar layout
        run: |
          npm run dev > /tmp/kontoklar-server.log 2>&1 &
          trap 'kill $!' EXIT
          node -e "const u='http://127.0.0.1:4173';(async()=>{for(let n=0;n<50;n++){try{if((await fetch(u)).ok)return;}catch{}await new Promise(r=>setTimeout(r,200));}process.exit(1);})()"
          node tests/sidebar.e2e.mjs
